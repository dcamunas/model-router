[project]
name = "model-router"
version = "0.22.0"
description = "Picks the model and effort for every Claude Code subagent by its risk, and checks and escalates the work that needs it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "David Camuñas" }
]
requires-python = ">=3.12"
keywords = ["claude", "claude-code", "anthropic", "llm", "router", "model-routing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.9",
]

[project.urls]
Repository = "https://github.com/dcamunas/model-router"
Issues = "https://github.com/dcamunas/model-router/issues"
Changelog = "https://github.com/dcamunas/model-router/blob/main/CHANGELOG.md"

[project.scripts]
router = "model_router.cli:main"
router-hook = "model_router.hook:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "N", "ANN", "ARG", "PTH", "SIM", "RET", "C90", "D"]
ignore = [
    "ANN401",  # Any: allowed for external JSON and interchangeable clients, with the reason next to it
    "D102",    # public methods: a docstring only where it adds to the name (modules, classes and functions always)
    "D105",    # magic methods
    "D106",    # nested classes
    "D107",    # __init__: the class docstring covers it
    "D205",    # compact style: the first sentence may run into the second line
]
extend-select = ["D401"]  # imperative mood on the first line, even though the google convention drops it

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"src/model_router/classify.py" = ["E501"]
"tests/*" = ["ANN", "D", "ARG", "PLR2004"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
