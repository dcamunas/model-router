name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - run: uv run pyright
      - run: uv build
      - name: the skill ships inside the wheel
        run: unzip -l dist/*.whl | grep -q 'model_router/claude_code/router/SKILL.md'
      - name: the read-only agent ships inside the wheel
        run: unzip -l dist/*.whl | grep -q 'model_router/claude_code/agents/reader.md'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: plugin and marketplace manifests validate with the Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
          claude plugin validate .claude-plugin/plugin.json --strict
