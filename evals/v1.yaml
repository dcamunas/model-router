# Evaluation set v1 for `router bench evals/v1.yaml --strategies "router,sonnet/medium>opus/high,fable/low"`.
# Fifteen made-up tasks across every kind the cli backend can run (no tools, so no `agentic`), frozen
# on 2026-10-20. A programmatic checker wherever the answer can be checked by code; the two critical
# tasks without one are there on purpose: only a judge can decide them.
tasks:
  - id: classify-01
    kind: classify
    risk: low
    prompt: |
      Classify each sentence as POSITIVE, NEGATIVE or NEUTRAL and answer with one line per
      sentence, in the format "n: LABEL".
      1. The order arrived earlier than expected.
      2. I have been waiting three weeks for an answer.
      3. Opening hours are 9 to 18.
    check_regex: "1: POSITIVE[\\s\\S]*2: NEGATIVE[\\s\\S]*3: NEUTRAL"

  - id: classify-02
    kind: classify
    risk: medium
    prompt: |
      Classify each support ticket as BILLING, TECHNICAL or SALES. Answer with one line per
      ticket, in the format "n: LABEL", nothing else.
      1. I was charged twice for my October subscription.
      2. The export button does nothing since yesterday's update.
      3. Do you offer a discount for 50 seats?
      4. My invoice shows the wrong company name.
      5. The API returns 500 on every request since 09:00.
    check_regex: "1: BILLING[\\s\\S]*2: TECHNICAL[\\s\\S]*3: SALES[\\s\\S]*4: BILLING[\\s\\S]*5: TECHNICAL"

  - id: extract-01
    kind: extract
    risk: high
    prompt: |
      From the text below, extract name, tax_id, date (ISO) and amount (a number) as a JSON
      object with those four keys and nothing else.
      "Invoice IW-0417 issued on 3 April 2026 to Imaginary Workshops Ltd, tax id GB000000000, for a
      total of 1,250.40 EUR."
    check_regex: "(?=[\\s\\S]*\"name\"\\s*:\\s*\"Imaginary Workshops Ltd\")(?=[\\s\\S]*\"tax_id\"\\s*:\\s*\"GB000000000\")(?=[\\s\\S]*\"date\"\\s*:\\s*\"2026-04-03\")(?=[\\s\\S]*\"amount\"\\s*:\\s*1250\\.40?\\b)"

  - id: extract-02
    kind: extract
    risk: medium
    prompt: |
      Extract every email address and every phone number from the text below. Answer with a JSON
      object with exactly two keys, "emails" and "phones", each a list of strings, nothing else.
      Copy the phone numbers exactly as written.
      "Contact Ana at ana.ruiz@example.org or +34 600 000 001. For invoices write to
      billing@example.org; the office line is 912 000 002."
    check_regex: "(?=[\\s\\S]*\"emails\"\\s*:\\s*\\[)(?=[\\s\\S]*\"phones\"\\s*:\\s*\\[)(?=[\\s\\S]*ana\\.ruiz@example\\.org)(?=[\\s\\S]*billing@example\\.org)(?=[\\s\\S]*600 000 001)(?=[\\s\\S]*912 000 002)"

  - id: search-01
    kind: search
    risk: low
    prompt: |
      Below are six lines. Reply with the numbers of the lines that contain an ISO 8601 date
      (YYYY-MM-DD), separated by commas, nothing else.
      1. Meeting on 2026-03-04
      2. Call me at 10:30
      3. Deadline 04/03/2026
      4. Released 2025-12-31
      5. Version 2.0.1
      6. Backup from 2024-01-15
    check_regex: "^\\s*1\\s*,\\s*4\\s*,\\s*6\\s*$"

  - id: summarize-01
    kind: summarize
    risk: low
    prompt: |
      Summarise in three sentences what a data warehouse is and what it is for.

  - id: chat-01
    kind: chat
    risk: low
    prompt: |
      In two sentences, what is the difference between a view and a materialized view?

  - id: code-01
    kind: code
    risk: medium
    prompt: |
      Write a Python function `parse_date(text: str) -> datetime.date` that accepts
      "DD/MM/YYYY", "D/M/YYYY" and "YYYY-MM-DD" and explicitly raises ValueError (a `raise`
      statement of your own) for anything else. Return only the code, no explanation.
    check_regex: "(?=[\\s\\S]*def parse_date\\()(?=[\\s\\S]*raise ValueError)"

  - id: code-02
    kind: code
    risk: high
    prompt: |
      BigQuery table `sales` with columns date DATE, customer_id STRING, amount NUMERIC.
      Write the query that returns, per customer, the total amount in 2025 and the number of
      distinct months of 2025 with sales, only for customers with sales in more than 6 distinct
      months of 2025. SQL only.
    check_regex: "(?=[\\s\\S]*COUNT\\s*\\(\\s*DISTINCT)(?=[\\s\\S]*(HAVING|WHERE)[\\s\\S]*>\\s*6)"

  - id: code-03
    kind: code
    risk: medium
    prompt: |
      Return a JSON Schema (draft 2020-12) for an object with the required fields id (integer),
      email (string, format email) and tags (array of strings). Answer with the schema only.
    check_json: [type, properties, required]

  - id: review-01
    kind: review
    risk: medium
    prompt: |
      Review this Python function and list every bug you find, one per line, naming the bug.

          def last_n(items, n, seen=[]):
              for i in range(1, n):
                  seen.append(items[-i])
              return seen
    check_regex: "(?=[\\s\\S]*(mutable|shared|default (list|argument)))(?=[\\s\\S]*(off.by.one|n ?- ?1|misses|skips|one fewer|fewer than n|only n-1))"

  - id: review-02
    kind: review
    risk: critical
    prompt: |
      Review this SQL migration before it runs on the production database of an invoicing
      service. List every problem that could cause downtime or data loss and say how to fix each.

          ALTER TABLE invoices ADD COLUMN currency CHAR(3) NOT NULL;
          ALTER TABLE invoices DROP COLUMN legacy_ref;
          UPDATE invoices SET currency = 'EUR';
    check_regex: "(?=[\\s\\S]*(default|nullable|backfill))(?=[\\s\\S]*(backup|irreversible|data loss|cannot be undone|lost))"

  - id: analysis-01
    kind: analysis
    risk: critical
    prompt: |
      A SaaS team sees p95 API latency up 40 % since this morning's deploy. The deploy added an
      index on orders(customer_id, created_at) and a background job that recomputes customer
      totals every 5 minutes. CPU on the database is up from 35 % to 80 %; the connection pool is
      at its limit; error rate is unchanged. Which of the two changes is the likelier cause, what
      would you check first to confirm it, and what is the safest immediate mitigation? Answer in
      at most 150 words.

  - id: write-01
    kind: write
    risk: critical
    prompt: |
      Write the customer-facing notice for a 45-minute outage of the invoicing service on
      2026-10-19 between 10:00 and 10:45 UTC. No data was lost. The cause was a configuration
      change; configuration changes now go through a second review and a staged rollout. Say what
      is being done to prevent it. At most 120 words, no greeting, no placeholders, nothing that is
      not in these facts.

  - id: write-02
    kind: write
    risk: medium
    prompt: |
      Write a release note of three bullet points for a version that adds CSV export of
      invoices, fixes a timezone bug in due dates, and drops support for Python 3.9. Plain text,
      no headings.
